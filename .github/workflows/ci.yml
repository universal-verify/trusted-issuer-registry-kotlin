name: SDK checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jvm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: echo "SDK_JAVA_17=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -Dorg.gradle.java.installations.paths="$SDK_JAVA_17,$JAVA_HOME" -PtestJavaVersion=${{ matrix.java }} check publishMavenPublicationToVerificationRepository
      - run: ./gradlew -p verification/jvm-gradle -Dorg.gradle.java.installations.paths="$SDK_JAVA_17,$JAVA_HOME" run kotlinSmoke verifyJvmVariant
      - run: mvn -f verification/jvm-maven/pom.xml -B compile exec:java
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-reports-${{ matrix.java }}
          path: build/reports
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - api: '26'
            target: google_apis
          - api: '37.2'
            target: google_apis_playstore_ps16k
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.2'
      - run: ./gradlew publishMavenPublicationToVerificationRepository
      - run: ./gradlew -p verification/android assembleRelease verifyAndroidVariant
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '${{ matrix.api }}'
          arch: x86_64
          target: '${{ matrix.target }}'
          script: ./gradlew -p verification/android connectedReleaseAndroidTest && python3 verification/check-device-results.py
      - run: python3 verification/measure-android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-${{ matrix.api }}
          path: |
            verification/android/build/reports
            verification/android/build/outputs/androidTest-results
            verification/android/build/dependency-size.json
